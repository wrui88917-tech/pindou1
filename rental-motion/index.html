<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星粒拼豆 · 在家快乐开拼</title>
<style>body{margin:0;background:#e5f2fa;display:grid;place-items:center;height:100vh;font-family:sans-serif}canvas{height:100%;max-width:100%;object-fit:contain}</style>
<canvas id="cv" width="1080" height="1920"></canvas>
<script>
const cv=document.querySelector('canvas'),ctx=cv.getContext('2d');
const W=1080,H=1920,D=36,FONT='"Noto Sans CJK SC","Microsoft YaHei",sans-serif';
const C={bg:'#F8FCFE',ink:'#102D50',blue:'#267EB1',pale:'#E4F3FC',line:'#CCE3F0',orange:'#F36535',peach:'#FFF0DB',green:'#6CB995'};
const pal=['#F58E9C','#FFB761','#F6D95F','#81C79C','#68C5D9','#7C9FE8','#BA9BDC'];
const clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>1-Math.pow(1-clamp(x),3),mix=(a,b,p)=>a+(b-a)*p;
let t=0,playing=true;
function rr(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function text(s,x,y,size=40,color=C.ink,weight=500,align='left'){ctx.font=`${weight} ${size}px ${FONT}`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillStyle=color;ctx.fillText(s,x,y)}
function lines(arr,x,y,size=38,gap=60,color=C.ink,weight=500){arr.forEach((s,i)=>text(s,x,y+i*gap,size,color,weight))}
function enter(u,delay,fn){let p=ease((u-delay)/.55);ctx.save();ctx.globalAlpha*=p;ctx.translate(0,(1-p)*35);fn(p);ctx.restore()}
function pill(s,x,y,w,fill=C.pale,color=C.blue,size=30){rr(x,y,w,56,28,fill);text(s,x+w/2,y+28,size,color,700,'center')}
function card(x,y,w,h,fill='#FFFFFF'){rr(x,y+8,w,h,30,'#DDECF450');rr(x,y,w,h,30,fill,C.line)}
function bead(x,y,r,c,hole=true){ctx.save();ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#FFFFFF65';ctx.beginPath();ctx.arc(x-r*.28,y-r*.3,r*.27,0,7);ctx.fill();if(hole){ctx.fillStyle=C.bg;ctx.beginPath();ctx.arc(x,y,r*.38,0,7);ctx.fill()}ctx.restore()}
const flower=['...ooo...','..ooooo..','..ooyoo..','..ooooo..','...ooo...','....g....','..g.g....','..ggg....','....ggg..','....g.g..','....g....'];
const heart=['.pp...pp.','pppp.pppp','ppppppppp','ppppppppp','.ppppppp.','..ppppp..','...ppp...','....p....'];
const star=['....y....','...yyy...','...yyy...','yyyyyyyyy','.yyyyyyy.','..yyyyy..','.yyyyyyy.','.yy...yy.'];
function art(pattern,cx,cy,cell,u,progress=1){const rows=pattern.length,cols=pattern[0].length;pattern.forEach((row,j)=>[...row].forEach((ch,i)=>{if(ch==='.')return;let p=ease(progress*2-(i+j)*.035);if(p<=0)return;let x=cx+(i-(cols-1)/2)*cell,y=cy+(j-(rows-1)/2)*cell-(1-p)*140;bead(x,y,cell*.44*p,{o:'#F58669',y:'#F1CC4F',g:'#71B894',p:'#F18DAA'}[ch])}))}
function board(cx,cy,size,u,smart=false){ctx.save();ctx.translate(cx,cy);ctx.rotate(Math.sin(u*.5)*.025);rr(-size/2,-size/2,size,size,22,smart?'#EAF5FB':'#FFFFFF',C.line);const cell=size/13;for(let j=0;j<12;j++)for(let i=0;i<12;i++){ctx.fillStyle='#B6D3E4';ctx.beginPath();ctx.arc(-size/2+(i+1)*cell,-size/2+(j+1)*cell,3,0,7);ctx.fill()}art(flower,0,0,cell*.87,u,clamp(u/1.6));ctx.restore()}
function box(cx,cy,w,u){let cell=w/8;ctx.save();ctx.translate(cx,cy);rr(-w/2-20,-cell*2-20,w+40,cell*4+40,24,'#FFFFFF',C.line);for(let j=0;j<4;j++)for(let i=0;i<8;i++){let x=-w/2+i*cell,y=-cell*2+j*cell;rr(x+2,y+2,cell-4,cell-4,7,'#F0F6FA');for(let k=0;k<4;k++)bead(x+cell*(.3+(k%2)*.4),y+cell*(.3+Math.floor(k/2)*.4),cell*.165,pal[(i+j)%7])}ctx.restore()}
function icon(kind,cx,cy,s){ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);ctx.strokeStyle=C.blue;ctx.lineWidth=7;ctx.lineCap='round';ctx.lineJoin='round';if(kind==='clock'){ctx.beginPath();ctx.arc(0,0,38,0,7);ctx.stroke();ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(0,0);ctx.lineTo(18,8);ctx.stroke()}else if(kind==='tool'){ctx.beginPath();ctx.moveTo(-24,35);ctx.lineTo(5,-30);ctx.lineTo(22,-38);ctx.lineTo(8,36);ctx.stroke()}else if(kind==='bag'){rr(-34,-22,68,60,9,C.peach,C.blue);ctx.beginPath();ctx.arc(0,-22,18,Math.PI,Math.PI*2);ctx.stroke()}else if(kind==='check'){ctx.beginPath();ctx.arc(0,0,38,0,7);ctx.stroke();ctx.beginPath();ctx.moveTo(-18,0);ctx.lineTo(-4,14);ctx.lineTo(22,-16);ctx.stroke()}ctx.restore()}
function heading(k,title,sub,u){enter(u,0,()=>pill(k,72,245,190));enter(u,.1,()=>text(title,72,365,80,C.ink,900));if(sub)enter(u,.2,()=>text(sub,76,451,34,C.blue,500))}
function row(y,label,value,kind,u,delay){enter(u,delay,()=>{card(72,y,936,145);icon(kind,146,y+72,.75);text(label,218,y+48,32,C.blue,600);text(value,218,y+101,43,C.ink,800)})}
function bg(time){ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);ctx.fillStyle='#ECF6FB';ctx.beginPath();ctx.arc(1060,0,440,0,7);ctx.fill();ctx.beginPath();ctx.arc(-150,1630,330,0,7);ctx.fill();for(let i=0;i<7;i++){let x=60+i*160,y=90+Math.sin(time*.8+i)*12;bead(x,y,9,pal[i])}}
function brand(){text('星粒拼豆',72,166,42,C.ink,800);text('把喜欢的像素，带回家慢慢拼',1008,166,25,C.blue,500,'right')}
const scenes=[
{a:0,b:3,name:'快乐开拼',draw(u){enter(u,.08,()=>pill('拼豆租赁 · 快乐到家',250,355,580,C.pale,C.blue,36));enter(u,.18,()=>{text('在家也能',540,525,100,C.ink,900,'center');text('快乐开拼',540,665,130,C.ink,900,'center')});board(540,1085,590,u);enter(u,.8,()=>text('豆子＋工具，一起带走',540,1510,49,C.blue,700,'center'));}},
{a:3,b:9,name:'两种方案',draw(u){heading('01 / 方案','两种方案，随心选','按你的创作习惯，选一套喜欢的',u);enter(u,.2,()=>{card(72,530,936,370);text('全套221色',116,601,51,C.ink,800);text('35.9',116,715,108,C.orange,900);text('元 / 24小时',410,746,34,C.ink,700);lines(['每色10克，约1000颗，共221盒','用量较多色支持增配'],116,818,30,45);box(824,705,230,u)});enter(u,.45,()=>{card(72,930,936,350);text('按图选色',116,1000,51,C.ink,800);pill('推荐',430,970,110,C.peach,C.orange,26);text('29.9',116,1112,108,C.orange,900);text('元 / 24小时',410,1143,34,C.ink,700);text('按图纸所需颜色配豆',116,1230,34,C.blue,500);art(heart,830,1108,24,u)});enter(u,.85,()=>{rr(72,1340,936,180,28,C.peach);text('租满3天享八折',540,1400,60,C.orange,900,'center');text('额外赠送 2 小时',540,1470,42,C.ink,700,'center')});}},
{a:9,b:15,name:'配套工具',draw(u){heading('02 / 工具','带齐工具，就能开拼','两种租赁方案均包含以下工具',u);const groups=[['豆板','104钉豆板×2 · 52钉豆板×2'],['豆针与镊子','双针豆针×1 · 单针豆针×1 · 直角镊子×1'],['立豆与铲豆','mini立豆盒×2 · 薯条豆铲×1'],['三合一工具','豆铲／立豆盘／挡盖工具×1套'],['收纳与耗材','美纹纸×1卷 · 收纳袋×1 · 常用色大盒×2']];groups.forEach(([a,b],i)=>enter(u,.2+i*.13,()=>{card(72,530+i*192,936,165);text(String(i+1).padStart(2,'0'),112,600+i*192,44,C.orange,800);text(a,208,577+i*192,37,C.ink,800);text(b,208,644+i*192,29,C.blue,500)}));enter(u,1,()=>pill('手机支架、毛刷可选配',235,1560,610,C.peach,C.ink,34));}},
{a:15,b:21,name:'计费规则',draw(u){heading('03 / 计费','花费清楚，放心拼','普通拼豆租赁的计费与押金',u);enter(u,.2,()=>{card(72,530,936,240,C.peach);text('每日含',116,592,37,C.ink,700);text('50克',116,682,104,C.orange,900);text('豆子消耗额度',424,701,38,C.ink,700);text('超出 0.2元／克',964,590,34,C.ink,600,'right')});row(805,'普通租赁押金','400元','bag',u,.35);row(980,'超时计费','≤12小时：15元','clock',u,.5);enter(u,.65,()=>{card(72,1155,936,145);icon('clock',146,1227,.75);text('超时计费',218,1203,32,C.blue,600);text('＞12小时：按完整一天计费',218,1256,38,C.ink,800)});row(1330,'增配工具 · 需提前沟通','10元／24小时','tool',u,.8);}},
{a:21,b:26,name:'智能拼豆板',draw(u){heading('04 / 智能板','跟着图纸，轻松拼','pixdou最新款104大板',u);board(540,795,460,u,true);enter(u,.35,()=>pill('黑透／白透可选',315,1095,450,C.pale,C.blue,34));enter(u,.5,()=>{text('28',315,1260,140,C.orange,900);text('元 / 24小时',505,1300,45,C.ink,800);pill('押金300元',329,1370,422,C.peach,C.ink,44)});enter(u,.85,()=>{text('会员号免费试用，内含海量素材',540,1520,37,C.ink,600,'center');text('也可自行选图导入软件',540,1590,37,C.blue,500,'center')});}},
{a:26,b:32,name:'配送与成品',draw(u){heading('05 / 服务','从开拼，到成品','每一步，都有照顾',u);const items=[['配送与归还',['到店自提或跑腿派送','租赁物品需自行归还']],'所有作品可代烫'];enter(u,.2,()=>{card(72,530,936,185);icon('bag',145,622,.75);text('配送与归还',218,578,39,C.ink,800);lines(['到店自提或跑腿派送','租赁物品需自行归还'],218,635,32,45,C.blue)});enter(u,.4,()=>{card(72,745,936,185);icon('check',145,837,.75);text('所有作品可代烫 · 特殊烫免费',218,797,38,C.ink,800);lines(['作品采用美纹纸转印','成品重量不超赠送及付费用豆额度'],218,853,31,44,C.blue)});enter(u,.6,()=>{card(72,960,936,235);text('镜像先确认',116,1012,40,C.ink,800);lines(['特殊烫不镜像','单面无孔需镜像','智能板遵循相同规则'],116,1074,34,44,C.blue)});enter(u,.8,()=>{card(72,1225,936,235);text('成品DIY协助',116,1280,40,C.ink,800);lines(['协助打孔、简单DIY','复杂DIY提供配件，需自行组装'],116,1350,34,56,C.blue)});}},
{a:32,b:36,name:'安心归还',draw(u){heading('06 / 归还','归还好，押金退','分类收好豆子，妥善保管工具',u);enter(u,.15,()=>{card(72,530,936,255,C.peach);icon('check',540,603,1);text('豆子无混盒 · 工具完好',540,689,50,C.ink,800,'center');text('归还当场退押',540,749,39,C.orange,800,'center')});row(825,'豆子混盒','按3元／盒扣费','bag',u,.3);row(1000,'工具损坏','按市场价扣除','tool',u,.4);enter(u,.55,()=>{text('发货及退押按实际称重结算',540,1230,39,C.blue,600,'center');text('把喜欢的像素',540,1420,66,C.ink,900,'center');text('一颗颗变成现实',540,1510,72,C.orange,900,'center')});}}
];
function sceneDraw(s,u){ctx.save();s.draw(u);ctx.restore()}
function draw(){bg(t);brand();let i=scenes.findIndex(s=>t>=s.a&&t<s.b);if(i<0)i=scenes.length-1;let s=scenes[i],u=t-s.a;const p=clamp(u/.45);if(i>0&&u<.45){ctx.save();ctx.globalAlpha=1-p;ctx.translate(-p*60,0);sceneDraw(scenes[i-1],scenes[i-1].b-scenes[i-1].a);ctx.restore()}ctx.save();ctx.globalAlpha=i===0?1:p;ctx.translate(i===0?0:(1-p)*70,0);sceneDraw(s,u);ctx.restore();rr(72,1745,936,4,2,C.line);rr(72,1745,936*clamp(t/D),4,2,C.orange);text(s.name,72,1802,28,C.blue,600);text('星粒拼豆 · 租赁指南',1008,1802,25,C.blue,500,'right');}
let started=0;function tick(ts){if(!started)started=ts;t=((ts-started)/1000)%D;draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
