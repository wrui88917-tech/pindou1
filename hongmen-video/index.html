<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>鸿门宴 · 生死数据图</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#15130f;color:#ede3cf;font-family:"STKaiti","KaiTi","Songti SC","Noto Serif SC",serif}body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}#stage{height:calc(100dvh - 72px);width:100%;display:grid;place-items:center}canvas{max-width:100%;max-height:100%;background:#ede3cf;box-shadow:0 10px 50px #0008}#bar{height:54px;width:min(94vw,620px);display:flex;align-items:center;gap:8px}button{border:1px solid #705e45;background:#2b251c;color:#ede3cf;border-radius:6px;padding:8px 12px;font:16px inherit;cursor:pointer}input{flex:1;accent-color:#b3261e}</style></head><body>
<div id="stage"><canvas id="cv" width="1080" height="1920"></canvas></div><div id="bar"><button id="play">▶ 播放</button><button id="replay">↺ 重播</button><input id="seek" type="range" min="0" max="40000" value="0"><button id="sound">🔇 声音关</button></div>
<script>
// ===== 统一配置 =====
const CONFIG={duration:40,width:1080,height:1920,colors:{paper:'#EDE3CF',ink:'#1B1A17',red:'#B3261E',green:'#5E7F73',gold:'#B08D57',pale:'#D8C9AA'},font:'"STKaiti","KaiTi","Songti SC","Noto Serif SC",serif',scenes:[
{start:0,end:4,quote:'沛公军霸上，未得与项羽相见。',plain:'刘邦驻军霸上，还没有见到项羽。'},
{start:4,end:10,quote:'项羽兵四十万，在新丰鸿门；沛公兵十万，在霸上。',plain:'数字为《史记》所载'},
{start:10,end:16,quote:'项王、项伯东向坐，亚父南向坐，沛公北向坐，张良西向侍。',plain:'座次本身，就是权力排序。'},
{start:16,end:22,quote:'范增数目项王，举所佩玉玦以示之者三，项王默然不应。',plain:'项伯翼蔽沛公，项庄不得击。'},
{start:22,end:28,quote:'哙遂入，披帷西向立，瞋目视项王，头发上指，目眦尽裂。',plain:'大行不顾细谨，大礼不辞小让。'},
{start:28,end:34,quote:'从此道至吾军，不过二十里耳。度我至军中，公乃入。',plain:'沛公走间道，张良留谢。'},
{start:34,end:38,quote:'竖子不足与谋！夺项王天下者，必沛公也。',plain:'范增拔剑撞破玉斗。'},
{start:38,end:40,quote:'夺项王天下者，必沛公也。',plain:'文本据《史记·项羽本纪》；数字为史记所载。'}]};
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=1080,H=1920,C=CONFIG.colors,F=CONFIG.font;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lerp=(a,b,p)=>a+(b-a)*p,easeOutCubic=x=>1-Math.pow(1-clamp(x),3),easeInOut=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2},easeOutBack=x=>{x=clamp(x);const c=1.70158;return 1+(c+1)*(x-1)**3+c*(x-1)**2};
const rnd=i=>{let x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
function text(s,x,y,size,color=C.ink,align='center',weight='700',alpha=1){ctx.save();ctx.globalAlpha*=clamp(alpha);ctx.font=`${weight} ${size}px ${F}`;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y);ctx.restore()}
function multiline(s,x,y,size,maxWidth,lineHeight,color=C.ink,align='center',weight='600'){let chars=[...s],line='',rows=[];ctx.font=`${weight} ${size}px ${F}`;for(const ch of chars){if(ctx.measureText(line+ch).width>maxWidth&&line){rows.push(line);line=ch}else line+=ch}if(line)rows.push(line);rows.forEach((r,i)=>text(r,x,y+i*lineHeight,size,color,align,weight));}
function rr(x,y,w,h,r,fill,stroke=null,lw=2){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function inkStroke(points,color=C.ink,width=12,alpha=.8){ctx.save();ctx.lineCap='round';ctx.lineJoin='round';for(let k=0;k<4;k++){ctx.beginPath();points.forEach(([x,y],i)=>{let ox=(rnd(k*99+i)-.5)*8,oy=(rnd(k*77+i+4)-.5)*8;i?ctx.lineTo(x+ox,y+oy):ctx.moveTo(x+ox,y+oy)});ctx.strokeStyle=color;ctx.globalAlpha=alpha*(1-k*.18);ctx.lineWidth=width*(1-k*.16);ctx.stroke()}ctx.restore()}
function paper(){ctx.fillStyle=C.paper;ctx.fillRect(0,0,W,H);for(let i=0;i<900;i++){let x=rnd(i)*W,y=rnd(i+900)*H;ctx.fillStyle=i%3?'rgba(82,62,35,.035)':'rgba(255,255,255,.055)';ctx.fillRect(x,y,1+rnd(i+33)*2,8+rnd(i+22)*24)}let g=ctx.createRadialGradient(W/2,H/2,500,W/2,H/2,1200);g.addColorStop(0,'rgba(237,227,207,0)');g.addColorStop(1,'rgba(44,33,22,.18)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function seal(name,x,y,r=62,fill=C.red,alpha=1){ctx.save();ctx.globalAlpha*=alpha;ctx.translate(x,y);ctx.rotate((rnd(name.length*31)-.5)*.05);ctx.fillStyle=fill;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.strokeStyle=C.paper;ctx.lineWidth=4;ctx.stroke();text(name,0,2,Math.min(42,r*.65),C.paper,'center','800');ctx.restore()}
function section(label,title,u){let p=easeOutCubic((u-.08)/.55),size=[...title].length>9?64:78;ctx.save();ctx.globalAlpha*=p;ctx.translate((1-p)*-80,0);text(label,72,130,28,C.green,'left','700');text(title,72,220,size,C.ink,'left','800');inkStroke([[72,287],[1008,287]],C.gold,4,.45);ctx.restore()}
function quoteBar(scene){ctx.save();ctx.fillStyle='rgba(27,26,23,.93)';ctx.fillRect(0,1640,W,280);text('史记原文',72,1690,25,C.gold,'left','700');multiline(scene.quote,W/2,1750,34,900,48,C.paper,'center','600');text(scene.plain,W/2,1860,24,'#D2C4A8','center','400');text('《史记·项羽本纪》',1008,1892,21,C.gold,'right','400');ctx.restore()}
function inkBloom(p,color=C.ink){p=clamp(p);ctx.save();ctx.globalAlpha=.92*(1-p*.15);ctx.fillStyle=color;for(let i=0;i<48;i++){let a=i/48*6.283,r=p*(1500+180*rnd(i)),x=W/2+Math.cos(a)*r,y=H/2+Math.sin(a)*r;ctx.beginPath();ctx.arc(x,y,100+220*rnd(i+20),0,7);ctx.fill()}ctx.restore()}
function scrollReveal(p){ctx.save();ctx.fillStyle='#D7C39B';let w=920*easeOutCubic(p);ctx.fillRect(W/2-w/2,330,w,980);ctx.strokeStyle=C.gold;ctx.lineWidth=8;ctx.strokeRect(W/2-w/2,330,w,980);for(let y=370;y<1280;y+=54)inkStroke([[W/2-w/2+20,y],[W/2+w/2-20,y]],C.gold,2,.18);ctx.restore()}
function militaryGrid(n,x,y,cols,p,color){for(let i=0;i<n;i++){let q=easeOutBack((p-i*.025)/.25);if(q<=0)continue;let cx=x+(i%cols)*54,cy=y+Math.floor(i/cols)*54;ctx.save();ctx.translate(cx,cy-(1-q)*80);ctx.scale(q,q);ctx.rotate((rnd(i)-.5)*.13);ctx.fillStyle=color;ctx.fillRect(-20,-20,40,40);ctx.strokeStyle=C.paper;ctx.lineWidth=2;ctx.strokeRect(-13,-13,26,26);ctx.restore()}}
function compass(x,y){ctx.save();ctx.translate(x,y);ctx.strokeStyle=C.ink;ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,48,0,7);ctx.stroke();text('北',0,-62,23,C.red);text('南',0,62,23);text('西',-62,0,23);text('东',62,0,23);ctx.beginPath();ctx.moveTo(0,-38);ctx.lineTo(12,12);ctx.lineTo(0,4);ctx.lineTo(-12,12);ctx.closePath();ctx.fillStyle=C.red;ctx.fill();ctx.restore()}
function arrow(x1,y1,x2,y2,color=C.red){ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();let a=Math.atan2(y2-y1,x2-x1);ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-20*Math.cos(a-.5),y2-20*Math.sin(a-.5));ctx.lineTo(x2-20*Math.cos(a+.5),y2-20*Math.sin(a+.5));ctx.closePath();ctx.fill()}
function jade(x,y,r=70,broken=false){ctx.save();ctx.translate(x,y);ctx.strokeStyle=C.green;ctx.lineWidth=24;ctx.beginPath();ctx.arc(0,0,r,broken?.28:0,broken?6.0:7);ctx.stroke();ctx.restore()}
function riskMeter(level){let x=74,y=530,h=760;ctx.fillStyle='rgba(179,38,30,.13)';ctx.fillRect(x,y,34,h);ctx.fillStyle=C.red;ctx.fillRect(x,y+h*(1-level),34,h*level);text('杀',91,486,30,C.red);text('机',91,1330,30,C.red)}
function mountain(x,y,s){ctx.save();ctx.translate(x,y);ctx.fillStyle='rgba(94,127,115,.19)';ctx.beginPath();ctx.moveTo(-s,y*0);ctx.quadraticCurveTo(-s*.35,-s*.9,0,-s*.15);ctx.quadraticCurveTo(s*.35,-s*1.15,s,-s*.1);ctx.lineTo(s,s*.35);ctx.lineTo(-s,s*.35);ctx.closePath();ctx.fill();ctx.restore()}
function path(points,p,color=C.red,dash=[]){ctx.save();ctx.strokeStyle=color;ctx.lineWidth=8;ctx.lineCap='round';ctx.setLineDash(dash);ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.setLineDash([]);ctx.stroke();let idx=Math.floor(clamp(p)*(points.length-1)),a=points[idx],b=points[Math.min(points.length-1,idx+1)],q=clamp(p*(points.length-1)-idx);return [lerp(a[0],b[0],q),lerp(a[1],b[1],q)]}
function subtitleTitle(t,s){text(t,W/2,430,52,C.ink,'center','700');text(s,W/2,500,25,C.green,'center','400')}
// ===== 分镜 =====
function scene0(u){scrollReveal(easeInOut(u/1.1));let p=easeOutCubic((u-.6)/.8);ctx.save();ctx.globalAlpha*=p;ctx.fillStyle=C.ink;for(let i=0;i<18;i++){ctx.beginPath();ctx.arc(W/2+(rnd(i)-.5)*380,650+(rnd(i+40)-.5)*240,40+rnd(i+3)*160,0,7);ctx.fill()}ctx.restore();text('鸿门宴',W/2,665,160,C.paper,'center','800',p);text('一场酒席上的生死数据图',W/2,900,54,C.ink,'center','600',easeOutCubic((u-1.2)/.6));text('《史记·项羽本纪》 · 约公元前206年',W/2,1000,34,C.red,'center','500',easeOutCubic((u-1.55)/.6))}
function scene1(u){section('数据一｜兵力与距离','四十万，对十万',u);let p=easeOutCubic((u-.5)/2);militaryGrid(40,235,500,8,p,C.red);militaryGrid(10,370,1130,5,easeOutCubic((u-1.4)/1.1),C.green);text('项羽军',80,500,34,C.red,'left');text(Math.round(40*clamp((u-.6)/1.7))+' 万',850,740,90,C.red,'center','800');text('号称百万',850,815,28,C.gold);text('刘邦军',80,1120,34,C.green,'left');text(Math.round(10*clamp((u-1.5)/1.1))+' 万',850,1270,90,C.green,'center','800');inkStroke([[210,1020],[870,1020]],C.ink,6,.7);text('相去四十里',W/2,980,39,C.ink);text('数字为《史记》所载',W/2,1500,25,C.gold)}
function scene2(u){section('数据二｜帐中座次','谁坐哪，谁为尊',u);compass(920,400);let p=easeOutCubic((u-.35)/.9);ctx.save();ctx.globalAlpha*=p;ctx.fillStyle='rgba(176,141,87,.15)';ctx.fillRect(235,570,610,640);ctx.strokeStyle=C.gold;ctx.lineWidth=5;ctx.strokeRect(235,570,610,640);ctx.restore();const seats=[['项王',230,690,'东'],['项伯',230,1010,'东'],['范增',540,550,'南'],['沛公',540,1230,'北'],['张良',865,880,'西']];seats.forEach(([n,x,y,d],i)=>{let q=easeOutBack((u-.7-i*.22)/.45);if(q<=0)return;seal(n,x,y,64,n==='沛公'?C.green:n==='张良'?C.gold:C.red,q);let dir={东:[90,0],西:[-90,0],南:[0,90],北:[0,-90]}[d];arrow(x,y,x+dir[0],y+dir[1],n==='沛公'?C.green:C.red)});text('尊',125,820,70,C.red,'center','800',easeOutCubic((u-2)/.5));text('东向为尊',125,900,27,C.red);text('上北 · 下南 · 左西 · 右东',W/2,1470,28,C.gold)}
function scene3(u){section('杀机｜三次示意','举玦三次，项王不应',u);riskMeter(clamp(.2+u*.13));seal('范增',260,760,80,C.red);seal('项王',790,760,80,C.ink);for(let i=0;i<3;i++){let q=easeOutBack((u-.5-i*.7)/.28);if(q>0){jade(260+i*115,500,48);text('①②③'[i],260+i*115,410,36,C.red)}}text('默然不应',790,920,42,C.ink);let spin=clamp((u-2.6)/2.5);seal('沛公',570,1260,72,C.green);seal('项庄',860,1180,64,C.red);seal('项伯',420,1120,64,C.gold);ctx.save();ctx.strokeStyle='rgba(179,38,30,.8)';ctx.lineWidth=9;ctx.beginPath();ctx.arc(570,1260,230,-1.4,-1.4+spin*5.3);ctx.stroke();ctx.restore();inkStroke([[445,1040],[520,1180],[500,1400]],C.ink,34,.65);text('翼蔽',420,1480,34,C.gold)}
function scene4(u){section('破局｜樊哙闯帐','一声撞门，杀机骤降',u);let shock=clamp((u-.35)/.25),shake=shock<1?Math.sin(u*90)*(1-shock)*22:0;ctx.save();ctx.translate(shake,0);rr(170,430,740,900,8,'rgba(176,141,87,.13)',C.gold,9);ctx.fillStyle=C.ink;ctx.fillRect(180,440,190,880);let q=easeOutBack((u-.45)/.55);ctx.translate(lerp(-280,540,q),950);ctx.fillStyle=C.ink;ctx.beginPath();ctx.arc(0,-210,105,0,7);ctx.fill();ctx.fillRect(-100,-110,200,400);for(let i=0;i<14;i++){let a=-2.8+i/13*2.45;inkStroke([[0,-250],[Math.cos(a)*160,Math.sin(a)*160-250]],C.ink,9,.55)}ctx.fillStyle=C.red;ctx.fillRect(-58,-235,30,13);ctx.fillRect(28,-235,30,13);ctx.restore();text('樊哙',540,1450,72,C.red,'center','800',q);text('披帷而入 · 瞋目视项王',540,1530,34,C.ink,'center','600',q);text('生彘肩',825,1170,30,C.gold);ctx.fillStyle=C.gold;ctx.beginPath();ctx.ellipse(825,1080,120,70,-.2,0,7);ctx.fill();riskMeter(lerp(.9,.25,easeOutCubic((u-1.2)/.7)))}
function scene5(u){section('数据三｜脱身路线','四十里大路，二十里间道',u);mountain(270,650,210);mountain(800,920,260);mountain(360,1370,230);const big=[[130,600],[380,700],[730,620],[920,800],[770,1080],[900,1330]],small=[[130,600],[270,900],[520,1030],[680,1280],[900,1330]];ctx.save();ctx.strokeStyle=C.gold;ctx.lineWidth=7;ctx.beginPath();big.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();ctx.setLineDash([20,14]);ctx.strokeStyle=C.red;ctx.beginPath();small.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();ctx.restore();text('鸿门',130,540,30,C.ink);text('霸上',900,1395,30,C.ink);text('约四十里',650,680,29,C.gold);text('间道不过二十里',430,1160,31,C.red);let pos=path(small,easeInOut((u-1)/3.2),C.red,[16,12]);['沛公','樊哙','夏侯婴','靳彊','纪信'].forEach((n,i)=>seal(n,pos[0]-i*42,pos[1]+i*34,37,i?C.ink:C.green));rr(720,430,290,190,10,'rgba(237,227,207,.82)',C.gold);text('张良留谢',865,470,28,C.ink);text('白璧一双',865,530,25,C.gold);text('玉斗一双',865,576,25,C.green)}
function scene6(u){section('决裂｜玉斗碎裂','“竖子不足与谋！”',u);let fall=clamp((u-.3)/1.2),y=lerp(470,1060,fall*fall);if(fall<.82){jade(W/2,y,150)}else{let p=easeOutCubic((fall-.82)/.18);for(let i=0;i<16;i++){let a=i/16*6.283,d=p*(140+360*rnd(i));ctx.save();ctx.translate(W/2+Math.cos(a)*d,1060+Math.sin(a)*d);ctx.rotate(a+p*2);ctx.fillStyle=C.green;ctx.fillRect(-30,-12,60,24);ctx.restore()}}text('夺项王天下者',W/2,1325,56,C.ink,'center','700',easeOutCubic((u-1.4)/.5));text('必沛公也',W/2,1435,90,C.red,'center','800',easeOutBack((u-1.8)/.6))}
function scene7(u){let p=easeOutBack((u-.12)/.55);ctx.save();ctx.translate(W/2,620);ctx.scale(p,p);ctx.rotate(-.04);ctx.fillStyle=C.red;ctx.fillRect(-210,-210,420,420);ctx.strokeStyle=C.paper;ctx.lineWidth=18;ctx.strokeRect(-175,-175,350,350);text('鸿门宴',0,0,102,C.paper,'center','800');ctx.restore();text('前206',160,1230,38,C.ink);text('前202',920,1230,38,C.ink);inkStroke([[250,1230],[820,1230]],C.red,8,.7);arrow(760,1230,830,1230,C.red);text('项羽放走的',W/2,1420,56,C.ink);text('是四年后的垓下',W/2,1510,76,C.red,'center','800')}
const DRAW=[scene0,scene1,scene2,scene3,scene4,scene5,scene6,scene7];
function render(){paper();let idx=CONFIG.scenes.findIndex(s=>t>=s.start&&t<s.end);if(idx<0)idx=7;let s=CONFIG.scenes[idx],u=t-s.start;DRAW[idx](u);quoteBar(s);let trans=Math.min(u,.55);if(idx>0&&trans<.55)inkBloom(1-trans/.55,C.paper);ctx.fillStyle=C.red;ctx.fillRect(0,1914,W*clamp(t/CONFIG.duration),6)}
// ===== 播放控制与声音 =====
let t=0,playing=false,last=0,ac=null,muted=true,lastBeat=-1,lastEvent=-1;
function tone(freq,dur=.22,vol=.04,type='sine',when=0){if(!ac||muted)return;let o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+when;o.type=type;o.frequency.setValueAtTime(freq,n);g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(.0001,n+dur);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+dur)}
function noise(dur=.25,vol=.08,when=0){if(!ac||muted)return;let len=ac.sampleRate*dur,b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=rnd(i+Math.floor(t*100))*2-1;let s=ac.createBufferSource(),g=ac.createGain(),n=ac.currentTime+when;s.buffer=b;g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(.0001,n+dur);s.connect(g);g.connect(ac.destination);s.start(n)}
const pent=[220,247,294,330,392];
function audio(){if(!playing||muted)return;let beat=Math.floor(t*2);if(beat!==lastBeat){lastBeat=beat;tone(pent[(beat*3)%5]*(beat%8>5?2:1),.32,.025,'triangle')}let ev=Math.floor(t*10);if(ev===lastEvent)return;lastEvent=ev;[16.5,17.2,17.9].forEach(x=>{if(Math.abs(t-x)<.06){tone(1320,.65,.08,'sine');tone(1760,.6,.035,'sine',.05)}});if(Math.abs(t-22.45)<.06){tone(65,.75,.18,'sine');noise(.38,.12)}if(Math.abs(t-34.95)<.06){noise(.5,.16);tone(310,.8,.11,'sawtooth');tone(120,.9,.08,'sine',.1)}}
function frame(ts){if(playing){t+=Math.min(.1,(ts-last)/1000);if(t>=CONFIG.duration){t=CONFIG.duration;playing=false}}last=ts;audio();render();seek.value=t*1000;play.textContent=playing?'⏸ 暂停':'▶ 播放';requestAnimationFrame(frame)}
const play=document.getElementById('play'),seek=document.getElementById('seek'),sound=document.getElementById('sound');play.onclick=()=>{if(t>=CONFIG.duration)t=0;playing=!playing};document.getElementById('replay').onclick=()=>{t=0;playing=true;lastBeat=-1};seek.oninput=()=>{t=seek.value/1000;lastBeat=-1};sound.onclick=()=>{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();ac.resume();muted=!muted;sound.textContent=muted?'🔇 声音关':'🔊 声音开'};requestAnimationFrame(frame);
</script></body></html>
