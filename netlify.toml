[build]
  command = "node build-auth.mjs"
  publish = "public"
  functions = "netlify/functions"
[build.environment]
  NODE_VERSION = "22"
[functions]
  node_bundler = "esbuild"
[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "SAMEORIGIN"
    Cache-Control = "no-store"
