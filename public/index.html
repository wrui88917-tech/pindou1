<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#778e53"><title>登录 · 豆格拼豆工作室</title><link rel="stylesheet" href="/login.css"></head><body><main><a class="brand" href="/">▦ 豆格 <small>BEAD STUDIO</small></a><div class="leaf">✦</div><h1>欢迎回到拼豆工作室</h1><p class="intro">登录后，把喜欢的画面拼成自己的作品。</p><form id="login-form"><label for="username">账号</label><input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="64" required placeholder="请输入管理员提供的账号"><label for="password">密码</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" maxlength="512" required placeholder="请输入密码"><button type="button" id="reveal" aria-label="显示密码" aria-pressed="false">显示</button></div><button class="submit" id="submit" type="submit">登录工作室 →</button><p id="message" role="status" aria-live="polite"></p></form><p class="footnote">需要账号或忘记密码？请联系网站管理员。<br>拼豆转换在本地完成；AI 漫画需经你同意上传照片。</p></main><script src="/login.js" defer></script></body></html>
