<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账号管理 · 豆格</title><link rel="stylesheet" href="/admin.css"></head><body><header><strong>▦ 豆格 · 账号管理</strong><nav><a href="/studio">进入拼豆工具 →</a><button id="logout">退出登录</button></nav></header><main><h1>把创作的入口交给你</h1><p class="intro">每个人使用独立账号。只有管理员可以添加账号；此网站不开放自助注册。</p><div class="layout"><section class="card"><h2>添加用户</h2><form id="create-form"><label for="new-username">登录账号</label><input id="new-username" name="username" placeholder="如 bead001" pattern="[A-Za-z0-9][A-Za-z0-9_.\-]{2,31}" minlength="3" maxlength="32" autocomplete="off" autocapitalize="none" required><small>3–32 位英文字母、数字、点、横线或下划线，不区分大小写。</small><label for="new-password">初始密码</label><input id="new-password" name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required><small>8–128 个字符。请通过你信任的渠道告知用户。</small><button class="primary" type="submit">创建账号</button></form><p class="note">管理员账号和密码在 Netlify 环境变量中管理。停用用户、启用用户或重置密码后，原有登录会话均需重新登录。</p></section><section class="card users"><div class="heading"><h2>用户列表 <span id="count"></span></h2><button id="refresh">刷新</button></div><p id="status" role="status" aria-live="polite"></p><div id="user-list"></div></section></div></main><dialog id="reset-dialog"><form id="reset-form"><h2>重置密码</h2><p id="reset-name"></p><label for="reset-password">新密码</label><input id="reset-password" name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required><p id="reset-status" role="status"></p><div class="actions"><button type="button" id="cancel-reset">取消</button><button class="primary" type="submit">确认重置</button></div></form></dialog><script src="/admin.js" defer></script></body></html>
